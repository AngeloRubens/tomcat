name: EL tests (fork only)
on:
  push:
    branches:
      - ci-el-*
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: zulu
    - name: Build and test EL
      run: ant -noinput deploy test-nio -Dtest.name="**/el/**/Test*.java" -Dtest.openssl.exists=false -Dtest.excludePerformance=true
    - name: Results
      if: always()
      run: grep -h "Tests run" output/build/logs/TEST*.txt | sort | uniq -c | sort -rn | head -50; grep -l -E "FAILED|Errors: [1-9]|Failures: [1-9]" output/build/logs/TEST*.txt || echo "no failures"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: el-test-logs
        path: output/build/logs/TEST*.txt
